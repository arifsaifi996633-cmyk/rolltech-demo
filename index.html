<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RollTech Automation Solutions | Premium Industrial Excellence</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --industrial-blue: #0066ff;
        --deep-white: #ffffff;
        --light-grey: #f8fafc;
        --charcoal: #111111;
        --body-text: #222222;
        --slate: #475569;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--deep-white);
        color: var(--body-text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1,
      h2,
      h3,
      h4,
      .font-heading {
        font-family: 'Montserrat', sans-serif;
        letter-spacing: -0.02em;
        color: var(--charcoal);
      }

      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: var(--light-grey);
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border: 2px solid var(--light-grey);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--industrial-blue);
      }

      .glass-card {
        background: rgba(255, 255, 255, 1);
        border: 1px solid rgba(0, 0, 0, 0.1);
      }

      .industrial-glow {
        box-shadow: 0 10px 40px rgba(0, 102, 255, 0.12);
      }

      @keyframes shutterOpen {
        0% {
          transform: translateY(0);
        }

        100% {
          transform: translateY(-100%);
        }
      }

      .animate-shutter {
        animation: shutterOpen 2.5s cubic-bezier(0.7, 0, 0.3, 1) forwards;
      }

      .text-glow {
        text-shadow: 0 0 30px rgba(0, 102, 255, 0.3);
      }

      .scanline {
        width: 100%;
        height: 100px;
        z-index: 10;
        background: linear-gradient(
          0deg,
          rgba(0, 102, 255, 0) 0%,
          rgba(0, 102, 255, 0.05) 50%,
          rgba(0, 102, 255, 0) 100%
        );
        opacity: 0.3;
        position: absolute;
        bottom: 100%;
        animation: scanline 8s linear infinite;
      }

      @keyframes scanline {
        0% {
          bottom: 100%;
        }

        100% {
          bottom: -10%;
        }
      }

      .metallic-gradient {
        background: linear-gradient(
          135deg,
          #111111 0%,
          #222222 50%,
          #444444 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .reveal-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .reveal-on-scroll.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>

  </head>

    <div id="root"></div>
  </body>
</html>
